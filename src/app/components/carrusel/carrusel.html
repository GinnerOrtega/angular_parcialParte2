<section class="container-fluid mt-5" id="promociones">
  <h2 class="titulo-seccion">Nuestras promociones</h2>
  <p class="text-center text-muted mb-4">Aprovecha los descuentos vigentes de este mes.</p>

  <div class="container">
    <div class="carousel-wrapper mx-auto">
      <div id="carouselPromos" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
        <div class="carousel-indicators">
          @for (promo of promociones; track promo.titulo; let i = $index, primero = $first) {
            <button type="button" data-bs-target="#carouselPromos" [attr.data-bs-slide-to]="i"
              [class.active]="primero" [attr.aria-current]="primero ? 'true' : null"
              [attr.aria-label]="'Promoción ' + (i + 1)"></button>
          }
        </div>

        <div class="carousel-inner">
          @for (promo of promociones; track promo.titulo; let primero = $first) {
            <div class="carousel-item" [class.active]="primero">
              <img [src]="promo.imagen" class="d-block w-100" [alt]="promo.alt">
              <div class="carousel-caption d-none d-md-block">
                <h5>{{ promo.titulo }}</h5>
                <p>{{ promo.descripcion }}</p>
              </div>
            </div>
          }
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselPromos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselPromos" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </div>
  </div>
</section>
